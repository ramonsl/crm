name: CI & Database Migration

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify-and-migrate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Database Migrations
        run: npx ts-node -O '{"module":"commonjs"}' scripts/migrate_prod.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run tests
        run: npm test
        env:
          CI: true

      - name: Build application
        run: npm run build
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Database URL might be needed for build if static pages fetch data
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
